<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="options-body">

  <div class="options-card">
    <header class="options-header">
      <img src="/images/icon_48.png" alt="" class="options-logo" />
      <div>
        <div class="options-title">Garmin Badge Database</div>
        <div class="options-subtitle">Settings</div>
      </div>
    </header>

    <div class="options-form">
      <div class="field">
        <label for="apiKey">API key</label>
        <div class="input-wrap">
          <input type="text" id="apiKey" placeholder="Paste your API key here" autocomplete="off" spellcheck="false" />
          <button type="button" id="toggleApiKey" class="eye-btn" title="Show / hide API key" aria-label="Show / hide API key">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <small>Find your API key on the <a href="https://garminbadges.com/dashboard" target="_blank">Dashboard</a> page after signing in.</small>
      </div>

      <div class="field">
        <label for="apiBase">API URL</label>
        <input type="url" id="apiBase" placeholder="https://api.garminbadges.com/api" />
        <small>Only change this for local development.</small>
      </div>
    </div>

    <div class="options-actions">
      <button id="save-btn" class="save-btn">Save</button>
      <span id="save-status" class="save-status"></span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
